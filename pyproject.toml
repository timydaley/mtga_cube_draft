[project]
name = "cube_draft"
version = "0.0.1"
description = "MTGA cube draft assistant"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "requests>=2.32",
    "pydantic>=2.7",
    "gymnasium>=1.0",
    "tqdm>=4.66",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "wandb>=0.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_draft"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
